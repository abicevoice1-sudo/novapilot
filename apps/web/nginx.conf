# Actlet web UI — serves the SPA, proxies API traffic to the backend.
# The backend service is named "api" (see root docker-compose.yml).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API + health go to the FastAPI backend (same-origin for the browser).
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # SSE streaming: disable buffering so tokens arrive live.
    proxy_buffering off;
    proxy_cache off;
  }
  location = /health {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  # SPA fallback for / and /settings.
  location / {
    try_files $uri /index.html;
  }
}
