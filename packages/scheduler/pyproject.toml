[project]
name = "novapilot-scheduler"
version = "0.6.0"
description = "NovaPilot scheduler: natural-language schedules, APScheduler service, missed-run replay"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novapilot_scheduler"]
