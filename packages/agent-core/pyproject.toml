[project]
name = "actlet-agent-core"
version = "0.3.0"
description = "Actlet agent core: tool registry, LangGraph plan→execute→verify, task runner"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2.0",
  "httpx>=0.27",
  # actlet-gateway installed separately (../packages/model-gateway)
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 is a false positive for FastAPI: Depends() in defaults is the documented idiom.
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actlet_agent"]
