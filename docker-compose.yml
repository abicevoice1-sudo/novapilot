services:
  api:
    build: ./services/api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - novapilot-data:/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/novapilot.db
    restart: unless-stopped

  # Milestone 3+: worker (scheduler + background jobs)
