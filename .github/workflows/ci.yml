name: ci
on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./packages/model-gateway && pip install pytest pytest-asyncio httpx ruff
      - name: Lint
        run: ruff check packages/model-gateway
      - name: Gateway tests
        working-directory: packages/model-gateway
        run: pytest -q

  agent-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./packages/model-gateway -e ./packages/agent-core && pip install pytest pytest-asyncio httpx ruff
      - name: Lint
        run: ruff check packages/agent-core
      - name: Agent-core tests
        working-directory: packages/agent-core
        run: pytest -q

  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./packages/memory && pip install pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check packages/memory
      - name: Memory tests
        working-directory: packages/memory
        run: pytest -q

  api:
    runs-on: ubuntu-latest
    needs: [gateway, agent-core, memory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./packages/model-gateway -e ./packages/agent-core -e ./packages/memory -e ./services/api && pip install pytest httpx
      - name: Lint
        run: ruff check services/api
      - name: API tests
        working-directory: services/api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build
        working-directory: apps/web
        run: npm ci && npm run build
