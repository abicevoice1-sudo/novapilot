[project]
name = "novapilot-api"
version = "0.1.0"
description = "NovaPilot API service (Milestone 1 skeleton: config + health)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
