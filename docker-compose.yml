  #   env_file: .env
  #   volumes:
  #     - novapilot-data:/data

  # Milestone 5+: isolated browser sandbox (Playwright)
  # browser:
  #   image: mcr.microsoft.com/playwright:v1.49.0-noble
  #   shm_size: 2gb

volumes:
  novapilot-data:
