[project]
name = "actlet-learning"
version = "0.7.0"
description = "Actlet learning loop: dreaming consolidation + file-based skills"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actlet_learning"]
