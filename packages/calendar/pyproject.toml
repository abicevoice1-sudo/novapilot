[project]
name = "actlet-calendar"
version = "0.8.0"
description = "Actlet calendar integration: CalDAV client + agent tools"
requires-python = ">=3.12"
dependencies = ["caldav>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actlet_calendar"]
