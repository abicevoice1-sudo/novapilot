name: ci
on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./packages/model-gateway -e ./services/api && pip install pytest pytest-asyncio httpx ruff
      - name: Lint
        run: ruff check packages/model-gateway services/api
      - name: Gateway tests
        working-directory: packages/model-gateway
        run: pytest -q

  api:
    runs-on: ubuntu-latest
    needs: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./packages/model-gateway -e ./services/api && pip install pytest httpx
      - name: API tests
        working-directory: services/api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build
        working-directory: apps/web
        run: npm ci && npm run build
