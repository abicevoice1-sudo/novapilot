# fly.toml — Actlet on Fly.io (one-command deploy)
#
# Usage:
#   fly launch --no-deploy        # first time (creates the app)
#   fly secrets set ACTLET_TOKEN=... GMAIL_ADDRESS=... GMAIL_APP_PASSWORD=...
#   fly deploy                    # every push after that
#
# Cost: free tier covers the smallest machine; add a volume for /data.

app = "actlet"
primary_region = "iad"

[build]
  dockerfile = "services/api/Dockerfile"

[env]
  PORT = "8000"
  WORKSPACE_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[mounts]]
  source = "actlet_data"
  destination = "/data"
