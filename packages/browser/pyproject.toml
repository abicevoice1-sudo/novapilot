[project]
name = "novapilot-browser"
version = "0.5.0"
description = "NovaPilot browser workspace: Playwright session, scoped navigation, approval-gated actions"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.40",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novapilot_browser"]
