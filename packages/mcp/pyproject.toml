[project]
name = "actlet-mcp"
version = "0.8.0"
description = "Actlet MCP client: use Model Context Protocol servers as agent tools (stdio)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actlet_mcp"]
