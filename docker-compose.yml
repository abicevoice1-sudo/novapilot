services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - actlet-data:/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/actlet.db
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # Milestone 3+: worker (scheduler + background jobs)
  # worker:
  #   build:
  #     context: .
  #     dockerfile: services/worker/Dockerfile
  #   env_file: .env
  #   volumes:
  #     - actlet-data:/data

  # Milestone 5+: isolated browser sandbox (Playwright)
  # browser:
  #   image: mcr.microsoft.com/playwright:v1.49.0-noble
  #   shm_size: 2gb

volumes:
  actlet-data:
