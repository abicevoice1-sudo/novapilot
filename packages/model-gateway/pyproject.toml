[project]
name = "novapilot-gateway"
version = "0.2.0"
description = "NovaPilot provider-neutral model gateway (LiteLLM-backed, fallback chains, budgets)"
requires-python = ">=3.12"
dependencies = ["litellm>=1.60"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 is a false positive for FastAPI: Depends() in defaults is the documented idiom.
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novapilot_gateway"]
